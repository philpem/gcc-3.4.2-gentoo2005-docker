name: build-and-publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Verify inputs
        run: scripts/verify-inputs.sh

      - name: Build image
        run: IMAGE="$IMAGE" scripts/build.sh

      - name: Smoke test
        run: IMAGE="$IMAGE" scripts/smoke-test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"

      - name: Push tag
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          tagged="${IMAGE%:latest}:$tag"
          docker tag "$IMAGE" "$tagged"
          docker push "$tagged"
